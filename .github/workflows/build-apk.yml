name: Build Lulu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Lulu project
        run: |
          .ZIP="LuluAndroid-Corrected-v2.zip"
          test -n "$ZIP"
          rm -rf /tmp/lulu
          mkdir -p /tmp/lulu
          unzip -q "$ZIP" -d /tmp/lulu

          if [ -f /tmp/lulu/LuluAndroid-Corrected-v2/build.gradle.kts ]; then
            cp -a /tmp/lulu/LuluAndroid-Corrected-v2/. .
          else
            cp -a /tmp/lulu/. .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Lulu APK
        uses: actions/upload-artifact@v4
        with:
          name: lulu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
